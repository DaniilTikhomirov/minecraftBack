# Пример фрагмента для server_name api.night-vision.su (после правки: sudo nginx -t && sudo systemctl reload nginx).
#
# Если в браузере «CORS», а curl показывает 502/HTML от nginx — запрос не доходит до Spring: проверь proxy_pass и что контейнер слушает 127.0.0.1:8080.

upstream minecraft_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name api.night-vision.su;

    # ssl_certificate / ssl_certificate_key — по certbot

    client_max_body_size 64m;

    # При 502 nginx отдаёт HTML без CORS → браузер пишет «CORS blocked», хотя упал бэкенд.
    # always — заголовки и на ошибках nginx (502/503). Основной CORS всё равно в Spring.
    set $cors_origin "";
    if ($http_origin ~* "^https?://(www\.)?night-vision\.su$") {
        set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://minecraft_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # WebSocket (плагин → /api/game/ws или /game/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # OPTIONS уходит в Spring — там CORS; не отдавать 405 с пустыми CORS-заголовками с nginx.
    }
}
