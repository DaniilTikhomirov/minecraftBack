services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minecraft_backend
    ports:
      - "8080:8080"

    environment:
      # Схема mc_backend создаётся в db-init; без currentSchema Liquibase/JPA часто не стартуют
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/minecraft?currentSchema=mc_backend
      SPRING_DATASOURCE_USERNAME: telegram
      SPRING_DATASOURCE_PASSWORD: tg123
      SUPER_ADMIN_USERNAME: admin
      SUPER_ADMIN_PASSWORD: admin
      JWT_SECRET_KEY: ReKJZW6VekQl9blL2NSD9PeOmU65d8tq
      REFRESH_SECRET_KEY: 9St9275RBcn2RCucOffCbYDnYjhvt94q
      # Общий секрет с плагином для WS (≥32 символа). Без него /api/game/ws и /api/game/online не работают.
      GAME_SERVER_WS_TOKEN: ${GAME_SERVER_WS_TOKEN:-}
      GAME_SERVER_STATS_SERVER_ID: ${GAME_SERVER_STATS_SERVER_ID:-default}

    # Монтируем папку на сервере → внутрь контейнера
    volumes:
      - ./storage:/app/storage

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      # Без curl -f: 503 у агрегированного /actuator/health при кратковременных сбоях БД не валит контейнер как «unhealthy».
      # «Connection refused» = curl завершится с ошибкой — контейнер останется нездоровым, пока порт не откроется.
      test: ["CMD-SHELL", "curl -sS --connect-timeout 4 -o /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 180s


  db:
    image: postgres:15
    container_name: minecraft_db
    environment:
      POSTGRES_DB: minecraft
      POSTGRES_USER: telegram
      POSTGRES_PASSWORD: tg123
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram -d minecraft"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
