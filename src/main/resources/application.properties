spring.application.name=minecraftBack

# На сервере задать SPRING_DATASOURCE_URL с ?currentSchema=mc_backend если дамп пустой, а дубликаты есть
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/minecraft?currentSchema=mc_backend}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:telegram}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tg123}
spring.data.jdbc.dialect=${SPRING_DATA_JDBC_DIALECT:postgresql}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=none

spring.liquibase.change-log=classpath:db/changelog/changelog-master.yml
spring.liquibase.default-schema=mc_backend
spring.jpa.properties.hibernate.default_schema=mc_backend

super.admin.default.username=${SUPER_ADMIN_USERNAME:admin}
super.admin.default.password=${SUPER_ADMIN_PASSWORD:admin}

jwt.secret.key=${JWT_SECRET_KEY:ReKJZW6VekQl9blL2NSD9PeOmU65d8tq}
refresh.secret.key=${REFRESH_SECRET_KEY:9St9275RBcn2RCucOffCbYDnYjhvt94q}

storage.dir=storage

# Jackson: не падать на неизвестные поля, именование полей camelCase
spring.jackson.deserialization.fail-on-unknown-properties=false

management.endpoints.web.exposure.include=health
springdoc.show-actuator=true
management.endpoint.health.show-details=always
# Отдельные /actuator/health/liveness и readiness для Docker/K8s (curl -f не падает на 503 агрегированного health)
management.endpoint.health.probes.enabled=true
management.server.port=8080
server.port=8080

# Тело запроса (JSON с base64-картинками). Nginx по умолчанию ~1MB — обязательно см. deploy/nginx-client-max-body.conf
server.tomcat.max-http-form-post-size=64MB
server.tomcat.max-swallow-size=64MB
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB

# Т-Банк интернет-эквайринг (TerminalKey + Password только из env на проде; не коммитить секреты)
# Тест: https://rest-api-test.tinkoff.ru/v2 — уточнить в личном кабинете / документации
# Бой: https://securepay.tinkoff.ru/v2
tbank.acquiring.base-url=${TBANK_ACQUIRING_BASE_URL:https://securepay.tinkoff.ru/v2}
tbank.acquiring.terminal-key=${TBANK_TERMINAL_KEY:}
tbank.acquiring.password=${TBANK_PASSWORD:}
tbank.acquiring.success-url=${TBANK_SUCCESS_URL:https://night-vision.su/payment/success}
tbank.acquiring.fail-url=${TBANK_FAIL_URL:https://night-vision.su/payment/fail}
# Публичный HTTPS URL этого бэка, например: https://api.night-vision.su/api/payments/tbank/notification
tbank.acquiring.notification-url=${TBANK_NOTIFICATION_URL:}

# WebSocket для игрового сервера: длинный случайный секрет (≥32 символа), только WSS на проде.
# Плагин передаёт тот же ключ в заголовке X-Game-Server-Token при handshake.
game-server.ws.token=${GAME_SERVER_WS_TOKEN:}

# Валидация перед созданием платежа: RPC по WebSocket (плагин уже подключён к /api/game/ws)
game-server.validation.require-online=${GAME_SERVER_VALIDATION_REQUIRE_ONLINE:true}
game-server.validation.rpc-timeout-ms=${GAME_SERVER_VALIDATION_RPC_TIMEOUT_MS:2000}

# Онлайн для сайта: команда плагину get online {serverId} (см. GET /api/game/online)
game-server.stats.server-id=${GAME_SERVER_STATS_SERVER_ID:default}
